name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tests — the same entry point a human uses
        # `npm test` runs the structural validator and DISCOVERS every
        # test/*_test.js. A hand-kept list here would drift from package.json
        # the first time a suite was added on one side only; validate.py fails
        # if this step stops calling it.
        run: npm test

      - name: Pin classifier (offline, deterministic)
        # The pure half of check_pins: which of ok/behind/missing a pin is, given
        # what the world publishes. No network, so it belongs in the blocking path
        # and cannot go red because a registry was slow.
        run: python3 test/check_pins.py --self-test

      - name: Pins match published releases
        # validate.py proves the pin, the submodule and the README agree with
        # each other. They can all agree and all be wrong: nothing local knows
        # what was actually published. This is the half that does.
        #
        # It blocks on exit 1 and only warns on exit 2, and the difference is the
        # whole point (B-13). A pin naming a version nobody published makes THIS
        # commit wrong, and no later release repairs it. A pin that is merely not
        # the newest says another agent released while this was in flight — five
        # runs went red for that in one day, and every fix was a bump unrelated
        # to the change under test. A gate that fails for someone else's release
        # teaches people to re-run it, not to read it.
        run: |
          set +e
          python3 test/check_pins.py | tee /tmp/pins.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::a pinned version was never published — a checkout of this commit installs something that does not exist"
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::pins are behind their newest release but all exist; a member shipped while this was in flight"
            {
              echo "### Pins behind their newest release"
              echo
              grep '^BEHIND' /tmp/pins.txt | sed 's/^/- /'
              echo
              echo "Every pin above names a real, published version, so this commit installs what it advertises."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"

      - name: Negative self-test (a wrong or missing npm name must fail)
        run: |
          set -eu
          # Two plants, because the guard has two halves and a run that only
          # exercises one of them proves half a guard.
          #
          # Structural by construction: it edits a JSON field rather than
          # searching for prose, and asserts it changed something first. A plant
          # whose replace no-ops is indistinguishable from a pass, and this repo
          # has watched that turn a working validator red (standing instruction #6).
          for mode in drop wrong; do
            rm -rf /tmp/npm-copy && cp -R . /tmp/npm-copy
 python3 test/plant_guard.py snap /tmp/npm-copy
            python3 - "$mode" <<'PY'
          import json, sys
          p = "/tmp/npm-copy/skills.json"
          d = json.load(open(p, encoding="utf-8"))
          e = next(x for x in d["skills"] if x.get("npm"))
          before = e["npm"]
          if sys.argv[1] == "drop":
              del e["npm"]
          else:
              e["npm"] = "@someone-else/" + e["name"]
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          after = next(x for x in json.load(open(p, encoding="utf-8"))["skills"]
                       if x["name"] == e["name"]).get("npm")
          assert after != before, f"plant did not land: npm is still {before!r}"
          print(f"planted {sys.argv[1]}: {e['name']} npm {before!r} -> {after!r}")
          PY
            python3 test/plant_guard.py verify /tmp/npm-copy "Negative self-test (a wrong or missing npm name must fail)"
            if python3 /tmp/npm-copy/test/validate.py; then
              echo "ERROR: validator accepted a $mode npm name — check_pins would query the wrong package and report the member unpublished"
              exit 1
            else
              echo "OK: validator rejects a $mode npm name"
            fi
          done

      - name: Negative self-test (an SSH submodule url must fail)
        run: |
          set -eu
          cp -R . /tmp/ssh-copy
          python3 test/plant_guard.py snap /tmp/ssh-copy
          python3 - <<'PY'
          p = "/tmp/ssh-copy/.gitmodules"
          s = open(p, encoding="utf-8").read()
          old = "url = https://github.com/ssheleg/agent-stack.git"
          assert old in s, "PLANT DID NOT LAND: no HTTPS url for agent-stack in .gitmodules"
          open(p, "w", encoding="utf-8").write(
              s.replace(old, "url = git@github.com:ssheleg/agent-stack.git", 1))
          PY
          python3 test/plant_guard.py verify /tmp/ssh-copy "Negative self-test (an SSH submodule url must fail)"
          if python3 /tmp/ssh-copy/test/validate.py; then
            echo "ERROR: validator accepted an SSH submodule url — it fails every clone without a key, CI included"
            exit 1
          else
            echo "OK: validator rejects a non-HTTPS submodule url"
          fi

      - name: Negative self-test (validator must be able to fail)
        run: |
          set -eu
          cp -R . /tmp/corrupt
          python3 test/plant_guard.py snap /tmp/corrupt
          # break the .gitmodules <-> skills.json agreement
          python3 - <<'PY'
          import json
          p="/tmp/corrupt/skills.json"
          d=json.load(open(p))
          d["skills"][0]["dir"]="skills/does-not-exist"
          json.dump(d, open(p,"w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/corrupt "Negative self-test (validator must be able to fail)"
          if python3 /tmp/corrupt/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy"
            exit 1
          else
            echo "OK: validator FAILs on submodule/manifest drift"
          fi

      - name: Negative self-test (a pin that lies must fail)
        run: |
          set -eu
          rm -rf /tmp/badpin
          cp -R . /tmp/badpin
          python3 test/plant_guard.py snap /tmp/badpin
          # claim a version the submodule does not contain
          python3 - <<'PY'
          import json
          p = "/tmp/badpin/skills.json"
          d = json.load(open(p))
          d["skills"][0]["version"] = "99.99.99"
          json.dump(d, open(p, "w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/badpin "Negative self-test (a pin that lies must fail)"
          if python3 /tmp/badpin/test/validate.py; then
            echo "ERROR: validator passed while the pin disagreed with the submodule"
            exit 1
          else
            echo "OK: validator FAILs when a pin does not match the submodule contents"
          fi

      - name: Negative self-test (a README row that lies must fail)
        run: |
          set -eu
          rm -rf /tmp/badreadme
          cp -R . /tmp/badreadme
          python3 test/plant_guard.py snap /tmp/badreadme
          # bump a pin without touching the README table — the exact drift
          # observed twice: the table kept advertising the previous version
          python3 - <<'PY'
          import json
          p = "/tmp/badreadme/skills.json"
          d = json.load(open(p))
          d["skills"][0]["version"] = "99.99.99"
          json.dump(d, open(p, "w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/badreadme "Negative self-test (a README row that lies must fail)"
          if python3 /tmp/badreadme/test/validate.py; then
            echo "ERROR: validator passed while the README table disagreed with skills.json"
            exit 1
          else
            echo "OK: validator FAILs when the README table drifts from the manifest"
          fi

      - name: Negative self-test (an empty test run must not read as a pass)
        run: |
          set -eu
          rm -rf /tmp/notests
          cp -R . /tmp/notests
          rm -f /tmp/notests/test/*_test.js
          if (cd /tmp/notests && npm test); then
            echo "ERROR: the runner passed with no suites at all"
            exit 1
          else
            echo "OK: no suites FAILs instead of reporting green"
          fi

      - name: Negative self-test (update dropping the runtime refresh must fail)
        run: |
          set -eu
          rm -rf /tmp/nortsync
          cp -R . /tmp/nortsync
          python3 test/plant_guard.py snap /tmp/nortsync
          python3 - <<'PY'
          # Anchored on the require, which is a structural line rather than prose, and
          # it asserts it changed something: standing instruction #6 and its corollary.
          # The fixtures in test/runtime_test.js prove lib/runtime.js copies correctly
          # and cannot prove anybody calls it — delete the call and they all stay green,
          # which is exactly how B-22 survived five releases.
          p = "/tmp/nortsync/bin/sshlg-skills.js"
          t = open(p, encoding="utf-8").read()
          old = "const rt = require('../lib/runtime.js');"
          assert old in t, "PLANT DID NOT LAND: the require is not where the guard reads it"
          t = t.replace(old, "const rt = null; // planted", 1)
          open(p, "w", encoding="utf-8").write(t)
          assert "const rt = null; // planted" in open(p, encoding="utf-8").read(), "PLANT DID NOT LAND"
          PY
          python3 test/plant_guard.py verify /tmp/nortsync "Negative self-test (update dropping the runtime refresh must fail)"
          if python3 /tmp/nortsync/test/validate.py; then
            echo "ERROR: cmdUpdate stopped refreshing the wired runtime and the validator passed"
            exit 1
          else
            echo "OK: validator FAILs when update no longer refreshes the code the hooks execute"
          fi

      - name: Negative self-test (a missing npm test entry point must fail)
        run: |
          set -eu
          rm -rf /tmp/noentry
          cp -R . /tmp/noentry
          python3 test/plant_guard.py snap /tmp/noentry
          python3 - <<'PY'
          import json
          p = "/tmp/noentry/package.json"
          d = json.load(open(p))
          d.pop("scripts", None)
          json.dump(d, open(p, "w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/noentry "Negative self-test (a missing npm test entry point must fail)"
          if python3 /tmp/noentry/test/validate.py; then
            echo "ERROR: validator passed with no npm test entry point"
            exit 1
          else
            echo "OK: validator FAILs when the entry point CI must use is gone"
          fi

      - name: Negative self-test (CI dropping `npm test` must fail)
        # The first version of this guard searched for the substring anywhere
        # in the file and stayed satisfied after the real step was deleted,
        # because the self-tests above mention it too. Planted, observed,
        # tightened to "a step whose command IS npm test".
        run: |
          set -eu
          rm -rf /tmp/nocit
          cp -R . /tmp/nocit
          python3 test/plant_guard.py snap /tmp/nocit
          python3 - <<'PY'
          p = "/tmp/nocit/.github/workflows/validate.yml"
          s = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(s.replace("        run: npm test", "        run: echo skipped"))
          PY
          python3 test/plant_guard.py verify /tmp/nocit "Negative self-test (CI dropping `npm test` must fail)"
          if python3 /tmp/nocit/test/validate.py; then
            echo "ERROR: validator passed while CI no longer runs npm test"
            exit 1
          else
            echo "OK: validator FAILs when the CI step is gone"
          fi

      - name: Launcher runs (no side effects)
        # Running the command, not `node --check`: the checker proves syntax
        # and not scope, and it once passed a `rest[++i]` against a variable
        # absent from that function, which would have thrown on first use.
        run: |
          set -eu
          node bin/sshlg-skills.js --help >/dev/null
          node bin/sshlg-skills.js agents >/dev/null
          node bin/sshlg-skills.js config >/dev/null
          echo "OK: launcher runs"
