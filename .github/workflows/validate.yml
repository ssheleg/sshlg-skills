name: validate

on:
  push:
  pull_request:
  # Callable, so `release.yml` gates a publish on THIS suite instead of a
  # copy of it. The negative self-tests live here as steps; running them
  # from the release workflow any other way means a second home per plant.
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the run-stamp guard resolves every SHA in retro.md, and a
          # shallow clone makes 31 real commits look fabricated. 224 commits, 37 MB.
          fetch-depth: 0

      - name: Install jsonschema (so the pipeline.json contract is CHECKED, not disclosed as skipped)
        run: python3 -m pip install --quiet jsonschema

      - name: Tests — the same entry point a human uses
        # `npm test` runs the structural validator and DISCOVERS every
        # test/*_test.js. A hand-kept list here would drift from package.json
        # the first time a suite was added on one side only; validate.py fails
        # if this step stops calling it.
        run: npm test

      - name: Pin classifier (offline, deterministic)
        # The pure half of check_pins: which of ok/behind/missing a pin is, given
        # what the world publishes. No network, so it belongs in the blocking path
        # and cannot go red because a registry was slow.
        run: python3 test/check_pins.py --self-test

      - name: Pins match published releases
        # validate.py proves the pin, the submodule and the README agree with
        # each other. They can all agree and all be wrong: nothing local knows
        # what was actually published. This is the half that does.
        #
        # It blocks on exit 1 and only warns on exit 2, and the difference is the
        # whole point (B-13). A pin naming a version nobody published makes THIS
        # commit wrong, and no later release repairs it. A pin that is merely not
        # the newest says another agent released while this was in flight — five
        # runs went red for that in one day, and every fix was a bump unrelated
        # to the change under test. A gate that fails for someone else's release
        # teaches people to re-run it, not to read it.
        run: |
          set +e
          python3 test/check_pins.py | tee /tmp/pins.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::a pinned version was never published — a checkout of this commit installs something that does not exist"
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::pins are behind their newest release but all exist; a member shipped while this was in flight"
            {
              echo "### Pins behind their newest release"
              echo
              grep '^BEHIND' /tmp/pins.txt | sed 's/^/- /'
              echo
              echo "Every pin above names a real, published version, so this commit installs what it advertises."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" = "3" ]; then
            # This repository's own newest tag is not on the registry. During a
            # release that is ALWAYS true — the tag exists, publish has not run yet
            # — so blocking here makes the check cause the very state it detects.
            # It did, on v0.87.0, the first release after it was added: red on the
            # tag, publish skipped, tag unshipped. The check is a report for an
            # operator or a later run, never a gate on the release that creates it.
            echo "::warning::this repository's newest tag is not on the registry yet — expected during a release, a finding afterwards"
            {
              echo "### Own tag not yet on the registry"
              echo
              grep -A4 '^TAGGED BUT NOT SHIPPED' /tmp/pins.txt | sed 's/^/> /'
              echo
              echo "Expected while this very release is publishing. If the run is not a release, the tag advertises a version nobody can install."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Anything else is an exit code this step has never seen. Failing is the
          # right default — an unrecognised verdict passed silently is how a check
          # stops being one — but it also means **adding an exit code to
          # check_pins.py is a change to this file too**, which is what v0.87.0
          # learned the expensive way.
          exit "$code"

      - name: Pin-source suite (7 cases — the four verdicts, on real git repos)
        run: python3 test/pin_source_test.py

      - name: Release-lag suite (6 cases — blind is not current)
        run: python3 test/release_lag_test.py

      # Not in `npm test`: it runs seven member validators and would put ~21 s on this
      # repository's per-commit gate, whose honesty rests on costing three.
      - name: Advertised plants (each member's own gate must refuse a dropped trigger)
        run: npm run test:plants

      - name: Negative self-test (a member behind its branch must be reported)
        run: |
          set -eu
          # The state that went unreported for six hours: a member whose `main` carries a
          # commit the pinned tag does not. Planted by moving a submodule back one commit,
          # so the check meets the real shape rather than a fixture of it.
          rm -rf /tmp/lagplant && cp -R . /tmp/lagplant
          sub=$(python3 -c "import json;print(json.load(open('/tmp/lagplant/skills.json'))['skills'][0]['dir'])")
          if ! git -C "/tmp/lagplant/$sub" rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            echo "no origin/main in the copied submodule — the plant cannot be built here"
            exit 1
          fi
          # Move origin/main FORWARD rather than walking HEAD back: CI clones submodules
          # shallow, so `HEAD~1` is not a commit here and the first draft of this plant
          # died on `pathspec 'HEAD~1' did not match any file(s)`. Synthesising the ref
          # works at any depth, and it is also the truer shape — the real incident was a
          # branch that moved, not a pin that reversed.
          old=$(git -C "/tmp/lagplant/$sub" rev-parse HEAD)
          git -C "/tmp/lagplant/$sub" -c user.email=plant@ci -c user.name=plant \
            commit -q --allow-empty -m "planted: an unreleased commit on main"
          git -C "/tmp/lagplant/$sub" update-ref refs/remotes/origin/main HEAD
          git -C "/tmp/lagplant/$sub" reset -q --hard "$old"
          out=$(cd /tmp/lagplant && python3 test/validate.py || true)
          if printf '%s' "$out" | grep -q 'unreleased commit'; then
            echo "planted lag was reported:"
            printf '%s\n' "$out" | grep 'unreleased commit'
          else
            echo "the check did not report a member sitting behind its own branch"
            printf '%s\n' "$out" | tail -20
            exit 1
          fi

      - name: Negative self-test (a plugin member wiring settings.json too must fail)
        run: |
          set -eu
          rm -rf /tmp/twochan && cp -R . /tmp/twochan
          python3 - <<'PY'
          # One mechanism with two homes and two lifetimes: uninstalling the plugin leaves
          # the settings entry firing, owned by nobody. B-19 decided the channel follows
          # the SHAPE of the thing, and this is the shape that has no second channel to
          # choose from.
          import glob, os
          hits = glob.glob("/tmp/twochan/skills/*/plugins/*/hooks/hooks.json")
          assert hits, "PLANT DID NOT LAND: no member ships plugin hooks"
          member = hits[0].split("/skills/")[1].split("/")[0]
          d = f"/tmp/twochan/skills/{member}/lib"
          os.makedirs(d, exist_ok=True)
          open(os.path.join(d, "wire.js"), "w").write(
              "// a second channel for one mechanism\n"
              "const p = require('os').homedir() + '/.claude/settings.json';\n"
              "cfg.hooks.PreToolUse.push({ matcher: 'Edit' });\n")
          print("planted a settings.json hook writer in", member)
          PY
          if python3 /tmp/twochan/test/validate.py; then
            echo "ERROR: validator accepted one mechanism wired through two channels"
            exit 1
          else
            echo "OK: validator refuses a plugin member that also writes settings.json"
          fi

      - name: Negative self-test (reusing a retired instruction id must fail)
        run: |
          set -eu
          rm -rf /tmp/reuse && cp -R . /tmp/reuse
          python3 - <<'PY'
          # Slot 3 was left vacant on purpose in v0.46.0 so published citations stayed
          # true. This plant fills it — the exact move an agent pruning the list will
          # reach for, because a gap looks like a mistake.
          import re
          p = "/tmp/reuse/docs/evidence/retro.md"
          s = open(p, encoding="utf-8").read()
          m = re.search(r"^2\. \*\*", s, re.M)
          assert m, "PLANT DID NOT LAND: instruction 2 is not where this expects it"
          s2 = s[:m.start()] + "3. **(2026-01-01) a refilled slot.** x\n\n" + s[m.start():]
          assert s2 != s, "PLANT DID NOT LAND"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/reuse/test/validate.py; then
            echo "ERROR: validator accepted a retired id being reused"
            exit 1
          else
            echo "OK: validator refuses to let a published citation change meaning"
          fi

      - name: Negative self-test (a member that guards only its doc registers must fail)
        run: |
          set -eu
          rm -rf /tmp/nosync && cp -R . /tmp/nosync
          python3 - <<'PY'
          # The premise B-44 was filed on was wrong: the config existed. What it lacked was
          # CHANGELOG.md and package.json, so two sessions wrote both at once under one
          # version number and the guard said nothing. The plant reproduces that exact
          # config — doc registers present, release surfaces absent.
          import json, glob
          hits = sorted(glob.glob("/tmp/nosync/skills/*/.claude/agent-sync.json"))
          assert hits, "PLANT DID NOT LAND: no member carries an agent-sync config"
          p = hits[0]
          d = json.load(open(p, encoding="utf-8"))
          before = list(d.get("guardedFiles") or [])
          d["guardedFiles"] = [g for g in before if g.startswith("docs/")]
          assert d["guardedFiles"] != before, \
              "PLANT DID NOT LAND: this config already guarded nothing but docs"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2)
          PY
          if python3 /tmp/nosync/test/validate.py; then
            echo "ERROR: validator accepted a member that guards no release surface"
            exit 1
          else
            echo "OK: validator refuses the config shape that let a collision through"
          fi

      - name: Negative self-test (a wrong pin must still fail)
        run: |
          set -eu
          rm -rf /tmp/pin-copy && cp -R . /tmp/pin-copy
          python3 - <<'PY'
          # Making a dirty working tree stop being a pin failure must not make a REAL
          # mismatch stop being one. This is the half of the change that could rot
          # silently: the loud half fires on every run, this one never would.
          import json
          p = "/tmp/pin-copy/skills.json"
          d = json.load(open(p, encoding="utf-8"))
          hit = next(s for s in d["skills"] if s.get("version"))
          before = hit["version"]
          hit["version"] = "99.99.99"
          assert hit["version"] != before, "PLANT DID NOT LAND: no versioned pin in skills.json"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY
          if python3 /tmp/pin-copy/test/validate.py; then
            echo "ERROR: validator accepted a pin that no checkout could satisfy"
            exit 1
          else
            echo "OK: a real mismatch is still red"
          fi

      - name: Negative self-test (losing a whole language of suites must fail)
        run: |
          set -eu
          rm -rf /tmp/disc-copy && cp -R . /tmp/disc-copy
          python3 - <<'PY'
          # Discovery replaced a hand-written list, so the failure mode moved: a glob that
          # matches nothing now silently runs zero suites and reports green. An empty side
          # is a broken glob, not a passing suite.
          import glob, os
          hits = glob.glob("/tmp/disc-copy/test/*_test.py")
          assert hits, "PLANT DID NOT LAND: no python suites to remove"
          for f in hits:
              os.rename(f, f + ".disabled")
          PY
          if node /tmp/disc-copy/test/run.js; then
            echo "ERROR: the runner reported green with zero python suites discovered"
            exit 1
          else
            echo "OK: a side at zero is reported as a broken glob"
          fi

      - name: Coordination configs are checked, in every repository that declares one
        run: |
          set -eu
          # B-46: forty-one coordination problems accumulated across nine repositories
          # because every repository's own validator was green and none of them asks
          # whether the coordination config describes files that exist. The check is a
          # script with an exit code; nothing was running it.
          #
          # The script ships inside the published package rather than as its bin — the bin
          # is the installer — so the package is fetched and the script called directly.
          npm i --no-save --silent @ssheleg/agent-sync >/dev/null 2>&1
          S="$PWD/node_modules/@ssheleg/agent-sync/plugins/agent-sync/skills/agent-sync/scripts/agent_sync.py"
          if [ ! -f "$S" ]; then
            echo "ERROR: agent_sync.py not found in the published package at the expected path"
            echo "       (the package layout changed; this check must be repointed, not deleted)"
            exit 1
          fi
          rc=0; seen=0
          for d in . skills/*/; do
            [ -f "$d/.claude/agent-sync.json" ] || continue
            seen=$((seen+1))
            echo "--- $d"
            ( cd "$d" && python3 "$S" check ) || rc=1
          done
          # A loop that matched nothing prints a clean bill of health for work it never
          # did. Nine repositories declare coordination; fewer than two means the glob
          # broke, not that the problem is solved.
          if [ "$seen" -lt 2 ]; then
            echo "ERROR: only $seen coordination config(s) found — the glob is wrong, and a"
            echo "       loop over nothing reports success for every repository it skipped"
            exit 1
          fi
          echo "checked $seen coordination config(s)"
          exit $rc

      - name: Negative self-test (stage 10 must name the coverage check)
        run: |
          set -eu
          rm -rf /tmp/nocov && cp -R . /tmp/nocov
          python3 - <<'PY'
          # A gate whose criterion names a script nobody seeded is prose, and a script
          # nobody's criterion runs is a file. Neither implies the other, so the guard
          # asserts both and this plant removes the naming half.
          import json
          p = "/tmp/nocov/pipeline.json"
          d = json.load(open(p, encoding="utf-8"))
          last = max(d["stages"], key=lambda s: s["id"])
          before = last["gate"]["check"]
          last["gate"]["check"] = before.replace("scripts/stage-coverage.sh", "the ladder walk")
          assert last["gate"]["check"] != before, \
              "PLANT DID NOT LAND: the final gate no longer names scripts/stage-coverage.sh"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY
          if python3 /tmp/nocov/test/validate.py; then
            echo "ERROR: validator accepted a final gate that runs no coverage check"
            exit 1
          else
            echo "OK: validator refuses an acceptance gate that cannot see a skipped stage"
          fi

      - name: Negative self-test (a wrong or missing npm name must fail)
        run: |
          set -eu
          # Two plants, because the guard has two halves and a run that only
          # exercises one of them proves half a guard.
          #
          # Structural by construction: it edits a JSON field rather than
          # searching for prose, and asserts it changed something first. A plant
          # whose replace no-ops is indistinguishable from a pass, and this repo
          # has watched that turn a working validator red (standing instruction #6).
          for mode in drop wrong; do
            rm -rf /tmp/npm-copy && cp -R . /tmp/npm-copy
            python3 test/plant_guard.py snap /tmp/npm-copy
            python3 - "$mode" <<'PY'
          import json, sys
          p = "/tmp/npm-copy/skills.json"
          d = json.load(open(p, encoding="utf-8"))
          e = next(x for x in d["skills"] if x.get("npm"))
          before = e["npm"]
          if sys.argv[1] == "drop":
              del e["npm"]
          else:
              e["npm"] = "@someone-else/" + e["name"]
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          after = next(x for x in json.load(open(p, encoding="utf-8"))["skills"]
                       if x["name"] == e["name"]).get("npm")
          assert after != before, f"plant did not land: npm is still {before!r}"
          print(f"planted {sys.argv[1]}: {e['name']} npm {before!r} -> {after!r}")
          PY
            python3 test/plant_guard.py verify /tmp/npm-copy "Negative self-test (a wrong or missing npm name must fail)"
            if python3 /tmp/npm-copy/test/validate.py; then
              echo "ERROR: validator accepted a $mode npm name — check_pins would query the wrong package and report the member unpublished"
              exit 1
            else
              echo "OK: validator rejects a $mode npm name"
            fi
          done

      - name: Negative self-test (a gate with no criterion must fail)
        run: |
          set -eu
          rm -rf /tmp/emptygate && cp -R . /tmp/emptygate
          python3 test/plant_guard.py snap /tmp/emptygate
          python3 - <<'PY'
          # Until 2026-08-14 every one of this repository's eleven stages was
          # {id, state, name, gate:{type}} — a gate with no criterion at all — and a run
          # passed all eleven by supplying them from doctrine. A placeholder reads as a
          # gate and checks nothing, so the guard measures the criterion, not its presence.
          import json
          p = "/tmp/emptygate/pipeline.json"
          d = json.load(open(p, encoding="utf-8"))
          old = d["stages"][6]["gate"]["check"]
          assert len(old) > 40, "PLANT DID NOT LAND: stage 6 has no real criterion to spoil"
          d["stages"][6]["gate"]["check"] = "tests pass"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY
          python3 test/plant_guard.py verify /tmp/emptygate "a stage criterion reduced to a placeholder"
          if python3 /tmp/emptygate/test/validate.py; then
            echo "ERROR: validator accepted a gate whose criterion says nothing"
            exit 1
          else
            echo "OK: validator refuses a gate that would pass by being unreadable"
          fi

      - name: Negative self-test (a workflow GitHub cannot parse must fail)
        run: |
          set -eu
          rm -rf /tmp/badwf && cp -R . /tmp/badwf
          python3 test/plant_guard.py snap /tmp/badwf
          python3 - <<'PY'
          # Re-indent one body line of a block scalar to a single space. GitHub answers
          # "this run likely failed because of a workflow file issue" and runs nothing;
          # `npm test` was green over exactly this until the parse guard existed. A
          # hand-rolled indentation check was tried first and PASSED this plant, because
          # it only looked at the first line of each block and the damage is mid-block.
          p = "/tmp/badwf/.github/workflows/validate.yml"
          lines = open(p, encoding="utf-8").read().split("\n")
          hit = next((i for i, l in enumerate(lines)
                      if l.startswith("          ") and l.strip().startswith("python3 ")), None)
          assert hit is not None, "PLANT DID NOT LAND: no deeply indented body line to spoil"
          lines[hit] = " " + lines[hit].lstrip()
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          PY
          python3 test/plant_guard.py verify /tmp/badwf "a workflow body line re-indented to one space"
          if python3 /tmp/badwf/test/validate.py; then
            echo "ERROR: validator accepted a workflow GitHub cannot parse"
            exit 1
          else
            echo "OK: validator refuses a workflow that would run nothing"
          fi

      - name: Negative self-test (an SSH submodule url must fail)
        run: |
          set -eu
          cp -R . /tmp/ssh-copy
          python3 test/plant_guard.py snap /tmp/ssh-copy
          python3 - <<'PY'
          p = "/tmp/ssh-copy/.gitmodules"
          s = open(p, encoding="utf-8").read()
          old = "url = https://github.com/ssheleg/agent-stack.git"
          assert old in s, "PLANT DID NOT LAND: no HTTPS url for agent-stack in .gitmodules"
          open(p, "w", encoding="utf-8").write(
              s.replace(old, "url = git@github.com:ssheleg/agent-stack.git", 1))
          PY
          python3 test/plant_guard.py verify /tmp/ssh-copy "Negative self-test (an SSH submodule url must fail)"
          if python3 /tmp/ssh-copy/test/validate.py; then
            echo "ERROR: validator accepted an SSH submodule url — it fails every clone without a key, CI included"
            exit 1
          else
            echo "OK: validator rejects a non-HTTPS submodule url"
          fi

      - name: Negative self-test (validator must be able to fail)
        run: |
          set -eu
          cp -R . /tmp/corrupt
          python3 test/plant_guard.py snap /tmp/corrupt
          # break the .gitmodules <-> skills.json agreement
          python3 - <<'PY'
          import json
          p="/tmp/corrupt/skills.json"
          d=json.load(open(p))
          d["skills"][0]["dir"]="skills/does-not-exist"
          json.dump(d, open(p,"w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/corrupt "Negative self-test (validator must be able to fail)"
          if python3 /tmp/corrupt/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy"
            exit 1
          else
            echo "OK: validator FAILs on submodule/manifest drift"
          fi

      - name: Negative self-test (a pin that lies must fail)
        run: |
          set -eu
          rm -rf /tmp/badpin
          cp -R . /tmp/badpin
          python3 test/plant_guard.py snap /tmp/badpin
          # claim a version the submodule does not contain
          python3 - <<'PY'
          import json
          p = "/tmp/badpin/skills.json"
          d = json.load(open(p))
          d["skills"][0]["version"] = "99.99.99"
          json.dump(d, open(p, "w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/badpin "Negative self-test (a pin that lies must fail)"
          if python3 /tmp/badpin/test/validate.py; then
            echo "ERROR: validator passed while the pin disagreed with the submodule"
            exit 1
          else
            echo "OK: validator FAILs when a pin does not match the submodule contents"
          fi

      - name: Negative self-test (a duplicate board id must fail)
        run: |
          set -eu
          rm -rf /tmp/dupid
          cp -R . /tmp/dupid
          python3 test/plant_guard.py snap /tmp/dupid
          # Structural: copy the LAST board row and give it an id already in use.
          # Anchored on the row shape `| B-nn |`, not on any row's wording.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/dupid/docs/evidence/backlog.md")
          lines = p.read_text().splitlines()
          idx = [i for i, l in enumerate(lines) if re.match(r"^\|\s*B-\d+\s*\|", l)]
          assert len(idx) >= 2, "fewer than two board rows — nothing to duplicate"
          first = re.split(r"(?<!\\)\|", lines[idx[0]])[1].strip()
          dup = re.sub(r"^\|\s*B-\d+\s*\|", f"| {first} |", lines[idx[-1]], count=1)
          assert dup != lines[idx[-1]], "PLANT DID NOT LAND: id substitution no-oped"
          lines.insert(idx[-1] + 1, dup)
          p.write_text("\n".join(lines) + "\n")
          PY
          python3 test/plant_guard.py verify /tmp/dupid "Negative self-test (a duplicate board id must fail)"
          if python3 /tmp/dupid/test/validate.py; then
            echo "ERROR: validator accepted two board rows sharing one id"
            exit 1
          else
            echo "OK: validator FAILs on a duplicate board id"
          fi

      - name: Negative self-test (a board row shifted by a bare pipe must fail)
        run: |
          set -eu
          rm -rf /tmp/shiftrow
          cp -R . /tmp/shiftrow
          python3 test/plant_guard.py snap /tmp/shiftrow
          # The real defect this reproduces: a bare `|` inside a cell adds a column and
          # every field after it shifts, so Status silently reads whatever landed there.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/shiftrow/docs/evidence/backlog.md")
          lines = p.read_text().splitlines()
          i = next(i for i, l in enumerate(lines) if re.match(r"^\|\s*B-\d+\s*\|", l))
          cells = re.split(r"(?<!\\)\|", lines[i])
          assert len(cells) > 3, "board row has too few cells to damage"
          cells[2] = cells[2] + " | injected"        # unescaped delimiter inside a cell
          lines[i] = "|".join(cells)
          p.write_text("\n".join(lines) + "\n")
          PY
          python3 test/plant_guard.py verify /tmp/shiftrow "Negative self-test (a board row shifted by a bare pipe must fail)"
          if python3 /tmp/shiftrow/test/validate.py; then
            echo "ERROR: validator accepted a board row with a shifted column count"
            exit 1
          else
            echo "OK: validator FAILs when a row's cell count differs from the table's"
          fi

      - name: Negative self-test (a README row that lies must fail)
        run: |
          set -eu
          rm -rf /tmp/badreadme
          cp -R . /tmp/badreadme
          python3 test/plant_guard.py snap /tmp/badreadme
          # bump a pin without touching the README table — the exact drift
          # observed twice: the table kept advertising the previous version
          python3 - <<'PY'
          import json
          p = "/tmp/badreadme/skills.json"
          d = json.load(open(p))
          d["skills"][0]["version"] = "99.99.99"
          json.dump(d, open(p, "w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/badreadme "Negative self-test (a README row that lies must fail)"
          if python3 /tmp/badreadme/test/validate.py; then
            echo "ERROR: validator passed while the README table disagreed with skills.json"
            exit 1
          else
            echo "OK: validator FAILs when the README table drifts from the manifest"
          fi

      - name: Negative self-test (an empty test run must not read as a pass)
        run: |
          set -eu
          rm -rf /tmp/notests
          cp -R . /tmp/notests
          rm -f /tmp/notests/test/*_test.js
          if (cd /tmp/notests && npm test); then
            echo "ERROR: the runner passed with no suites at all"
            exit 1
          else
            echo "OK: no suites FAILs instead of reporting green"
          fi

      - name: Negative self-test (update dropping the runtime refresh must fail)
        run: |
          set -eu
          rm -rf /tmp/nortsync
          cp -R . /tmp/nortsync
          python3 test/plant_guard.py snap /tmp/nortsync
          python3 - <<'PY'
          # Anchored on the require, which is a structural line rather than prose, and
          # it asserts it changed something: standing instruction #6 and its corollary.
          # The fixtures in test/runtime_test.js prove lib/runtime.js copies correctly
          # and cannot prove anybody calls it — delete the call and they all stay green,
          # which is exactly how B-22 survived five releases.
          p = "/tmp/nortsync/bin/sshlg-skills.js"
          t = open(p, encoding="utf-8").read()
          old = "const rt = require('../lib/runtime.js');"
          assert old in t, "PLANT DID NOT LAND: the require is not where the guard reads it"
          t = t.replace(old, "const rt = null; // planted", 1)
          open(p, "w", encoding="utf-8").write(t)
          assert "const rt = null; // planted" in open(p, encoding="utf-8").read(), "PLANT DID NOT LAND"
          PY
          python3 test/plant_guard.py verify /tmp/nortsync "Negative self-test (update dropping the runtime refresh must fail)"
          if python3 /tmp/nortsync/test/validate.py; then
            echo "ERROR: cmdUpdate stopped refreshing the wired runtime and the validator passed"
            exit 1
          else
            echo "OK: validator FAILs when update no longer refreshes the code the hooks execute"
          fi

      - name: Negative self-test (a missing npm test entry point must fail)
        run: |
          set -eu
          rm -rf /tmp/noentry
          cp -R . /tmp/noentry
          python3 test/plant_guard.py snap /tmp/noentry
          python3 - <<'PY'
          import json
          p = "/tmp/noentry/package.json"
          d = json.load(open(p))
          d.pop("scripts", None)
          json.dump(d, open(p, "w"), indent=2)
          PY
          python3 test/plant_guard.py verify /tmp/noentry "Negative self-test (a missing npm test entry point must fail)"
          if python3 /tmp/noentry/test/validate.py; then
            echo "ERROR: validator passed with no npm test entry point"
            exit 1
          else
            echo "OK: validator FAILs when the entry point CI must use is gone"
          fi

      - name: Negative self-test (CI dropping `npm test` must fail)
        # The first version of this guard searched for the substring anywhere
        # in the file and stayed satisfied after the real step was deleted,
        # because the self-tests above mention it too. Planted, observed,
        # tightened to "a step whose command IS npm test".
        run: |
          set -eu
          rm -rf /tmp/nocit
          cp -R . /tmp/nocit
          python3 test/plant_guard.py snap /tmp/nocit
          python3 - <<'PY'
          p = "/tmp/nocit/.github/workflows/validate.yml"
          s = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(s.replace("        run: npm test", "        run: echo skipped"))
          PY
          python3 test/plant_guard.py verify /tmp/nocit "Negative self-test (CI dropping `npm test` must fail)"
          if python3 /tmp/nocit/test/validate.py; then
            echo "ERROR: validator passed while CI no longer runs npm test"
            exit 1
          else
            echo "OK: validator FAILs when the CI step is gone"
          fi

      - name: Negative self-test (a document claiming an address that does not resolve must fail)
        # Three plants, one per claim class, because a reference dies in three ways and the
        # two real defects (UM-03, M-07) were one of each: `README.md:66` claimed
        # `npm run test:negatives`, which is task-pipeline's script and exits 1 here, and
        # `docs/evidence/convergence.md:10` named a `scripts/` file that has never existed.
        # A run that exercises one class proves a third of the guard.
        #
        # The `link` plant is the one worth having: it repoints a markdown TARGET while
        # leaving the label alone. The first draft of this extractor read labels, which made
        # `README.md:69` — a live row whose link resolves — report as dead, and would have
        # let a genuinely broken target through under a label that still read fine.
        run: |
          set -eu
          for mode in npm path link; do
            rm -rf /tmp/refs-copy && cp -R . /tmp/refs-copy
            python3 test/plant_guard.py snap /tmp/refs-copy
            python3 - "$mode" <<'PY'
          import sys
          mode = sys.argv[1]
          p = "/tmp/refs-copy/docs/DOCMAP.md"
          s = open(p, encoding="utf-8").read()
          before = s
          if mode == "npm":
              s += "\nRun `npm run test:negatives` to feed every guard a planted defect.\n"
          elif mode == "path":
              s += "\nThe convergence gate is `scripts/check-convergence.sh`.\n"
          else:
              s += "\nSee [`lib/apply.js`](lib/apply-renamed-away.js) for the write path.\n"
          open(p, "w", encoding="utf-8").write(s)
          assert open(p, encoding="utf-8").read() != before, f"plant did not land: {mode}"
          print(f"planted {mode} into docs/DOCMAP.md")
          PY
            python3 test/plant_guard.py verify /tmp/refs-copy "Negative self-test (an unresolvable claimed address must fail)"
            if python3 /tmp/refs-copy/test/validate.py; then
              echo "ERROR: validator accepted a $mode claim naming nothing — a document about resolvable addresses would ship one that is not (M-07)"
              exit 1
            else
              echo "OK: validator rejects a $mode claim whose address does not resolve"
            fi
          done
          # And the corpus itself: an extractor that matches nothing must refuse, not pass.
          # An empty corpus passes everything, which is how this class of guard dies quiet.
          rm -rf /tmp/refs-empty && cp -R . /tmp/refs-empty
          python3 test/plant_guard.py snap /tmp/refs-empty
          python3 - <<'PY'
          p = "/tmp/refs-empty/test/validate.py"
          s = open(p, encoding="utf-8").read()
          old = 'LIVE_DOCS = ("README.md", "CLAUDE.md", "docs/DOCMAP.md", "docs/AGENT_SYNC.md",\n             "docs/evidence/convergence.md")'
          assert old in s, "PLANT DID NOT LAND: LIVE_DOCS is not where this expects it"
          open(p, "w", encoding="utf-8").write(s.replace(old, 'LIVE_DOCS = ()', 1))
          PY
          python3 test/plant_guard.py verify /tmp/refs-empty "the enforced corpus emptied"
          if python3 /tmp/refs-empty/test/validate.py; then
            echo "ERROR: validator passed with an empty address corpus — a guard whose corpus is empty passes everything"
            exit 1
          else
            echo "OK: validator FAILs when the address corpus matches nothing"
          fi

      - name: Launcher runs (no side effects)
        # Running the command, not `node --check`: the checker proves syntax
        # and not scope, and it once passed a `rest[++i]` against a variable
        # absent from that function, which would have thrown on first use.
        run: |
          set -eu
          node bin/sshlg-skills.js --help >/dev/null
          node bin/sshlg-skills.js agents >/dev/null
          node bin/sshlg-skills.js config >/dev/null
          echo "OK: launcher runs"
