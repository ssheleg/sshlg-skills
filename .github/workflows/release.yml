name: release

# Toggleable: runs only when the repo variable RELEASE_ENABLED == 'true'.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Structural validator
        run: python3 test/validate.py

      - name: Derive version from tag
        id: v
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tag must match package.json
        run: |
          set -eu
          PV=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "$PV" != "${{ steps.v.outputs.ver }}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json $PV"; exit 1
          fi

      - name: Extract this version's CHANGELOG section
        run: |
          set -eu
          awk -v v="${{ steps.v.outputs.ver }}" '
            $0 ~ "^## v" v "([^0-9]|$)" {f=1; next}
            /^## v/ {f=0}
            f {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "no CHANGELOG section for v${{ steps.v.outputs.ver }}"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME} — sshlg-skills" \
            --notes-file /tmp/notes.md --latest

      - name: Post-release smoke test (launcher runs from the tag, no side effects)
        run: |
          set -eu
          cd "$(mktemp -d)"
          npx --yes "github:ssheleg/sshlg-skills#${GITHUB_REF_NAME}" list
          echo "OK: launcher runs from released tag"
